name: Build macOS (Apple Silicon)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon Runner

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-src-8.0.4-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target Repetitor_VST3 Repetitor_AU RepetitorInst_VST3 RepetitorInst_AU Repetitor_CLAP RepetitorInst_CLAP -j 4

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Repetitor_artefacts/Release/AU/Repetitor.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/RepetitorInst_artefacts/Release/AU/Repetitor Instrument.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Dkng" || true
          set -o pipefail
          auval -v aumi Rpt1 Dkng | tail -20
          auval -v aumu Rpt2 Dkng | tail -20

      - name: Sign (ad-hoc) and package
        run: |
          ART=build/Repetitor_artefacts/Release
          codesign --force --deep --sign - "$ART/VST3/Repetitor.vst3"
          codesign --force --deep --sign - "$ART/AU/Repetitor.component"
          codesign --force --deep --sign - "$ART/CLAP/Repetitor.clap"
          INST=build/RepetitorInst_artefacts/Release
          codesign --force --deep --sign - "$INST/VST3/Repetitor Instrument.vst3"
          codesign --force --deep --sign - "$INST/AU/Repetitor Instrument.component"
          codesign --force --deep --sign - "$INST/CLAP/Repetitor Instrument.clap"
          mkdir -p dist "pkg/Repetitor"
          cp -R "$ART/VST3/Repetitor.vst3" "pkg/Repetitor/"
          cp -R "$ART/AU/Repetitor.component" "pkg/Repetitor/"
          cp -R "$ART/CLAP/Repetitor.clap" "pkg/Repetitor/"
          cp -R "$INST/VST3/Repetitor Instrument.vst3" "pkg/Repetitor/"
          cp -R "$INST/AU/Repetitor Instrument.component" "pkg/Repetitor/"
          cp -R "$INST/CLAP/Repetitor Instrument.clap" "pkg/Repetitor/"
          cp INSTALL.txt "pkg/Repetitor/INSTALL.txt"
          cp docs/Repetitor-Manual-EN.pdf docs/Repetitor-Manual-DE.pdf "pkg/Repetitor/"
          cp docs/Repetitor-Manual-EN.pdf docs/Repetitor-Manual-DE.pdf dist/
          ditto -c -k --keepParent "pkg/Repetitor" "dist/Repetitor-macOS-arm64.zip"

      - name: Build installer (.pkg)
        run: |
          ART=build/Repetitor_artefacts/Release
          VERSION=$(grep -m1 -oE 'project\(Repetitor VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          INST=build/RepetitorInst_artefacts/Release
          mkdir -p pkgroot build/pkg
          cp -R "$ART/VST3/Repetitor.vst3" pkgroot/
          cp -R "$INST/VST3/Repetitor Instrument.vst3" pkgroot/
          # Bundle nicht umleiten (sonst installiert macOS ggf. an einen alten Ort)
          pkgbuild --analyze --root pkgroot build/pkg/component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/pkg/component.plist
          plutil -replace 1.BundleIsRelocatable -bool NO build/pkg/component.plist
          chmod +x installer/scripts/preinstall
          pkgbuild --root pkgroot --component-plist build/pkg/component.plist --scripts installer/scripts \
            --identifier ch.danikoenig.repetitor.vst3 --version "$VERSION" \
            --install-location "/Library/Audio/Plug-Ins/VST3" build/pkg/RepetitorVST3.pkg
          # AU-Paket
          mkdir -p pkgroot-au
          cp -R "$ART/AU/Repetitor.component" pkgroot-au/
          cp -R "$INST/AU/Repetitor Instrument.component" pkgroot-au/
          pkgbuild --analyze --root pkgroot-au build/pkg/component-au.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/pkg/component-au.plist
          plutil -replace 1.BundleIsRelocatable -bool NO build/pkg/component-au.plist
          pkgbuild --root pkgroot-au --component-plist build/pkg/component-au.plist \
            --identifier ch.danikoenig.repetitor.au --version "$VERSION" \
            --install-location "/Library/Audio/Plug-Ins/Components" build/pkg/RepetitorAU.pkg
          # CLAP-Paket
          mkdir -p pkgroot-clap
          cp -R "$ART/CLAP/Repetitor.clap" pkgroot-clap/
          cp -R "$INST/CLAP/Repetitor Instrument.clap" pkgroot-clap/
          pkgbuild --analyze --root pkgroot-clap build/pkg/component-clap.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/pkg/component-clap.plist
          pkgbuild --root pkgroot-clap --component-plist build/pkg/component-clap.plist \
            --identifier ch.danikoenig.repetitor.clap --version "$VERSION" \
            --install-location "/Library/Audio/Plug-Ins/CLAP" build/pkg/RepetitorCLAP.pkg
          sed "s/@VERSION@/$VERSION/g" installer/distribution.xml > build/pkg/distribution.xml
          productbuild --distribution build/pkg/distribution.xml --resources installer/resources \
            --package-path build/pkg "dist/Repetitor-Installer.pkg"
          pkgutil --payload-files "dist/Repetitor-Installer.pkg" | head -5

      - name: Build uninstaller (.pkg)
        run: |
          VERSION=$(grep -m1 -oE 'project\(Repetitor VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          mkdir -p build/unpkg dist
          chmod +x installer/uninstall/scripts/postinstall
          pkgbuild --nopayload --scripts installer/uninstall/scripts \
            --identifier ch.danikoenig.repetitor.uninstall --version "$VERSION" build/unpkg/RepetitorUninstall.pkg
          sed "s/@VERSION@/$VERSION/g" installer/uninstall/distribution.xml > build/unpkg/distribution.xml
          productbuild --distribution build/unpkg/distribution.xml --resources installer/uninstall/resources \
            --package-path build/unpkg "dist/Repetitor-Uninstaller.pkg"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Repetitor-macOS-arm64
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.pdf

      - name: Release (bei Tag v* oder Commit mit [release])
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: Repetitor ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*.zip
            dist/*.pkg
            dist/*.pdf

      - name: Remove older releases (only the newest stays)
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$KEEP" ]; then
              echo "Deleting release $tag"
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
